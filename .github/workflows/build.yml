name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you press a "Run workflow" button

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install pyinstaller pillow pypdf

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name PrintShopOrganizer PrintShopOrganizer.py

      - name: Save the EXE for download
        uses: actions/upload-artifact@v4
        with:
          name: PrintShopOrganizer
          path: dist/PrintShopOrganizer.exe
