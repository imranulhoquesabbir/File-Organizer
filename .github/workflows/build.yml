name: Build Windows EXE and publish release

on:
  push:
    branches: [main]
    paths: ["PrintShopOrganizer.py"]   # only rebuild when the program changes
  workflow_dispatch:                   # lets you press a "Run workflow" button

permissions:
  contents: write                      # needed to publish the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version and repository into the program
        shell: python
        run: |
          p = "PrintShopOrganizer.py"
          s = open(p, encoding="utf-8").read()
          s = s.replace('APP_VERSION = "0"', 'APP_VERSION = "${{ github.run_number }}"')
          s = s.replace('GITHUB_REPO = ""', 'GITHUB_REPO = "${{ github.repository }}"')
          open(p, "w", encoding="utf-8").write(s)

      - name: Install tools
        run: pip install pyinstaller pillow pypdf

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name PrintShopOrganizer PrintShopOrganizer.py

      - name: Publish release (this is what triggers the update popup)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Version ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: dist/PrintShopOrganizer.exe
